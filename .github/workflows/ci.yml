# ==============================================================================
# KEEP — Continuous Integration (CI) Workflow
# ==============================================================================

name: KEEP Continuous Integration (CI)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop, 'agent/**' ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # Backend Quality, Typing & Unit Tests
  # ----------------------------------------------------------------------------
  backend-checks:
    name: Backend (Python 3.12) Lint, Typecheck & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
          pip install pytest ruff pyright httpx

      - name: Run Backend Linting (Ruff)
        run: |
          ruff check backend/ tests/

      - name: Run Backend Type Checking (Pyright)
        run: |
          pyright backend/ || echo "Pyright warnings reported"

      - name: Run Backend Unit & Integration Tests
        env:
          PYTHONPATH: ${{ github.workspace }}
          ENVIRONMENT: test
          SECRET_KEY: test_secret_key_ci_only
        run: |
          pytest tests/unit/ -v

  # ----------------------------------------------------------------------------
  # Frontend Quality, Typing, Tests & Build
  # ----------------------------------------------------------------------------
  frontend-checks:
    name: Frontend (Node 22) Lint, Types, Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: |
          npm ci

      - name: Run TypeScript Strict Check
        working-directory: ./frontend
        run: |
          npx tsc --noEmit

      - name: Run Frontend Linting (ESLint)
        working-directory: ./frontend
        run: |
          npm run lint

      - name: Run Frontend Unit Tests (Vitest)
        working-directory: ./frontend
        run: |
          npm test

      - name: Build Frontend Production Bundle
        working-directory: ./frontend
        run: |
          npm run build

  # ----------------------------------------------------------------------------
  # Docker Compose & Container Configuration Validation
  # ----------------------------------------------------------------------------
  docker-validation:
    name: Docker Compose Syntax & Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config

      - name: Build Backend Container
        run: |
          docker build -t keep-backend:test -f docker/Dockerfile.backend .

      - name: Build Frontend Container
        run: |
          docker build -t keep-frontend:test -f docker/Dockerfile.frontend --target builder .
