# ==============================================================================
# KEEP Enterprise Platform — Production Container Orchestration
# ==============================================================================
# Specification: devdocs/p1/p1.10.txt (Chapters 3, 4, 5, 8, 9, 10, 11) & ADR-029/030/031
# Architecture: docs/Architecture/deployment-ai-infrastructure.md
# Role: Member 4 (DevOps & Integration Lead)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Reverse Proxy Gateway (Nginx 1.27) — TLS 1.3 Termination & Ingress
  # ----------------------------------------------------------------------------
  gateway:
    image: nginx:1.27-alpine
    container_name: keep-gateway
    restart: always
    ports:
      - "${NGINX_PORT_HTTP:-80}:80"
      - "${NGINX_PORT_HTTPS:-443}:443"
    volumes:
      - ./infrastructure/nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_certs:/etc/nginx/certs:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:80/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - keep-network

  # ----------------------------------------------------------------------------
  # 2. Frontend Web Application (Next.js / Vite Static Runtime on Nginx)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      target: production
    container_name: keep-frontend-prod
    restart: always
    expose:
      - "3000"
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - keep-network

  # ----------------------------------------------------------------------------
  # 3. Backend Application API Engine (FastAPI + Uvicorn Production Workers)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: keep-backend-prod
    restart: always
    command: ["uvicorn", "backend.app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "4"]
    expose:
      - "8000"
    volumes:
      - storage_data:/app/storage
    environment:
      ENVIRONMENT: production
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PROJECT_NAME: ${PROJECT_NAME:-KEEP — Knowledge Extraction & Enterprise Platform}
      API_V1_STR: ${API_V1_STR:-/api/v1}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be provided in production}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-keep_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be provided}
      POSTGRES_DB: ${POSTGRES_DB:-keep_db}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-keep_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-keep_db}
      SYNC_DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-keep_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-keep_db}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-20}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-30}
      DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-1800}
      DB_POOL_PRE_PING: "true"
      DB_STATEMENT_TIMEOUT_MS: 30000
      ENABLE_OPENAPI_DOCS: ${ENABLE_OPENAPI_DOCS:-false}
      GZIP_MINIMUM_SIZE: 1000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379/0
      STORAGE_ROOT: /app/storage
      DEFAULT_STORAGE_QUOTA_BYTES: ${DEFAULT_STORAGE_QUOTA_BYTES:-10737418240}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 2048M
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - keep-network

  # ----------------------------------------------------------------------------
  # 4. PostgreSQL 16 + pgvector Persistence Layer
  # ----------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: keep-postgres-prod
    restart: always
    command: >
      postgres
      -c shared_buffers=1GB
      -c max_connections=200
      -c work_mem=32MB
      -c maintenance_work_mem=256MB
      -c effective_cache_size=3GB
      -c random_page_cost=1.1
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-keep_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be provided}
      POSTGRES_DB: ${POSTGRES_DB:-keep_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 4096M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-keep_user} -d ${POSTGRES_DB:-keep_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - keep-network

  # ----------------------------------------------------------------------------
  # 5. Redis 7 High-Performance Cache & Task Broker
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: keep-redis-prod
    restart: always
    command: redis-server --appendonly yes --maxmemory 768mb --maxmemory-policy allkeys-lru
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - keep-network

  # ----------------------------------------------------------------------------
  # 6. Prometheus Production Metrics Scraper (Internal)
  # ----------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: keep-prometheus-prod
    restart: always
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    expose:
      - "9090"
    volumes:
      - ./infrastructure/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 1024M
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - keep-network

  # ----------------------------------------------------------------------------
  # 7. Grafana Enterprise Observability Dashboards (Admin Only)
  # ----------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.1.0
    container_name: keep-grafana-prod
    restart: always
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be provided}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/grafana/dashboards:/etc/grafana/provisioning/dashboards/keep:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - keep-network

  # ----------------------------------------------------------------------------
  # 8. Grafana Loki Log Aggregation Engine
  # ----------------------------------------------------------------------------
  loki:
    image: grafana/loki:3.1.0
    container_name: keep-loki-prod
    restart: always
    command: -config.file=/etc/loki/loki-config.yml
    expose:
      - "3100"
    volumes:
      - ./infrastructure/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 1024M
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - keep-network

  # ----------------------------------------------------------------------------
  # 9. Promtail Host & Container Log Forwarding Agent
  # ----------------------------------------------------------------------------
  promtail:
    image: grafana/promtail:3.1.0
    container_name: keep-promtail-prod
    restart: always
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./infrastructure/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - loki
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: 256M
    networks:
      - keep-network

  # ----------------------------------------------------------------------------
  # 10. AI Knowledge Ingestion & Vector Background Worker (Phase 2.1)
  # ----------------------------------------------------------------------------
  ai-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: keep-ai-worker-prod
    restart: always
    volumes:
      - storage_data:/app/storage
      - ai_model_cache:/app/models/cache
    environment:
      ENVIRONMENT: production
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PROJECT_NAME: ${PROJECT_NAME:-KEEP — Knowledge Extraction & Enterprise Platform}
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-keep_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be provided}
      POSTGRES_DB: ${POSTGRES_DB:-keep_db}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-keep_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-keep_db}
      SYNC_DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-keep_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-keep_db}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379/0
      AI_WORKER_QUEUES: "ai_ingestion_queue,ai_embedding_queue"
      AI_MODEL_CACHE_DIR: /app/models/cache
      STORAGE_ROOT: /app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 4096M
    healthcheck:
      test: ["CMD-SHELL", "python -c 'exit(0)' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - keep-network

# ------------------------------------------------------------------------------
# Persistent Volume Declarations
# ------------------------------------------------------------------------------
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  storage_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  loki_data:
    driver: local
  nginx_certs:
    driver: local
  certbot_www:
    driver: local
  ai_model_cache:
    driver: local

# ------------------------------------------------------------------------------
# Network Topology
# ------------------------------------------------------------------------------
networks:
  keep-network:
    driver: bridge
