# ==============================================================================
# KEEP — Prometheus Alerting Rules Specification (Phase 1.9)
# Specification: devdocs/p1/p1.9.txt (Chapter 10, 17)
# Architecture: docs/Architecture/observability-architecture.md (Section 6)
# ==============================================================================

groups:
  - name: keep_platform_alerts
    rules:
      # ------------------------------------------------------------------------
      # Database Connectivity & Health Alerts
      # ------------------------------------------------------------------------
      - alert: DatabaseOffline
        expr: db_pool_active_connections < 0 or up{job="keep-backend"} == 0
        for: 15s
        labels:
          severity: CRITICAL
          tier: database
        annotations:
          summary: "PostgreSQL Database or Backend API is offline"
          description: "Database connectivity probe failed or backend instance is unreachable for >15s."
          runbook_url: "docs/Deployment/observability-monitoring-runbook.md#databaseoffline"

      - alert: DatabasePoolNearExhaustion
        expr: (db_pool_active_connections / db_pool_size) * 100 > 85
        for: 1m
        labels:
          severity: WARNING
          tier: database
        annotations:
          summary: "Database connection pool utilization exceeds 85%"
          description: "Active connections are at {{ $value | printf \"%.1f\" }}% of maximum pool size (threshold: 85%)."
          runbook_url: "docs/Deployment/observability-monitoring-runbook.md#databasepoolnearexhaustion"

      # ------------------------------------------------------------------------
      # API Latency & Error Rate Alerts
      # ------------------------------------------------------------------------
      - alert: HighApiErrorRate
        expr: (sum(rate(http_requests_total{status=~"5.."}[2m])) / sum(rate(http_requests_total[2m]))) * 100 > 2.0
        for: 2m
        labels:
          severity: WARNING
          tier: application
        annotations:
          summary: "API 5xx error rate exceeds 2%"
          description: "Current error rate is {{ $value | printf \"%.2f\" }}% over a 2-minute rolling window."
          runbook_url: "docs/Deployment/observability-monitoring-runbook.md#highapierrorrate"

      - alert: CriticalApiErrorRate
        expr: (sum(rate(http_requests_total{status=~"5.."}[1m])) / sum(rate(http_requests_total[1m]))) * 100 > 5.0
        for: 1m
        labels:
          severity: CRITICAL
          tier: application
        annotations:
          summary: "CRITICAL: API 5xx error rate exceeds 5%"
          description: "Current error rate is {{ $value | printf \"%.2f\" }}% over a 1-minute window."
          runbook_url: "docs/Deployment/observability-monitoring-runbook.md#criticalapierrorrate"

      - alert: HighLatencyP95
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le)) > 0.25
        for: 3m
        labels:
          severity: WARNING
          tier: application
        annotations:
          summary: "API p95 latency exceeds 250ms SLA"
          description: "Current p95 request duration is {{ $value | printf \"%.3f\" }}s (SLA: 0.250s)."
          runbook_url: "docs/Deployment/observability-monitoring-runbook.md#highlatencyp95"

      # ------------------------------------------------------------------------
      # Storage Capacity & Quota Alerts
      # ------------------------------------------------------------------------
      - alert: StorageNearCapacity
        expr: (storage_used_bytes / storage_capacity_bytes) * 100 > 85
        for: 5m
        labels:
          severity: WARNING
          tier: storage
        annotations:
          summary: "Storage volume utilization exceeds 85%"
          description: "Multi-tenant storage volume is at {{ $value | printf \"%.1f\" }}% of total provisioned capacity."
          runbook_url: "docs/Deployment/observability-monitoring-runbook.md#storagenearcapacity"

      - alert: StorageCriticalCapacity
        expr: (storage_used_bytes / storage_capacity_bytes) * 100 > 95
        for: 2m
        labels:
          severity: CRITICAL
          tier: storage
        annotations:
          summary: "CRITICAL: Storage volume utilization exceeds 95%"
          description: "Multi-tenant storage volume is near full exhaustion ({{ $value | printf \"%.1f\" }}%). Risk of write lockouts."
          runbook_url: "docs/Deployment/observability-monitoring-runbook.md#storagecriticalcapacity"

      # ------------------------------------------------------------------------
      # Security & Rate Limiting Alerts
      # ------------------------------------------------------------------------
      - alert: BruteForceAttempt
        expr: sum(rate(http_requests_total{handler=~".*login.*", status="401"}[3m])) * 60 > 10
        for: 1m
        labels:
          severity: SECURITY
          tier: security
        annotations:
          summary: "Potential authentication brute-force attack detected"
          description: "High rate of failed authentication attempts detected (>10 failed logins/min)."
          runbook_url: "docs/Deployment/observability-monitoring-runbook.md#bruteforceattempt"

      - alert: AIRateLimitExceeded
        expr: sum(rate(http_requests_total{status="429"}[5m])) * 60 > 20
        for: 2m
        labels:
          severity: WARNING
          tier: ai-engine
        annotations:
          summary: "High frequency of rate-limited requests (HTTP 429)"
          description: "Over 20 requests per minute are hitting API or AI rate limits."
          runbook_url: "docs/Deployment/observability-monitoring-runbook.md#airatelimitexceeded"

      # ------------------------------------------------------------------------
      # AI Ingestion Pipeline Alerts (Phase 2.1)
      # ------------------------------------------------------------------------
      - alert: AIIngestionQueueBacklogHigh
        expr: ai_ingestion_queue_pending_jobs > 50
        for: 5m
        labels:
          severity: WARNING
          tier: ai-ingestion
        annotations:
          summary: "AI Ingestion queue backlog exceeds 50 pending documents"
          description: "Ingestion queue depth has remained elevated for >5m, indicating background worker starvation."
          runbook_url: "docs/Deployment/observability-monitoring-runbook.md#aiingestionqueuebackloghigh"

      - alert: AIIngestionFailureRateHigh
        expr: (sum(rate(ai_ingestion_jobs_total{status="FAILED"}[5m])) / sum(rate(ai_ingestion_jobs_total[5m]))) * 100 > 5.0
        for: 2m
        labels:
          severity: CRITICAL
          tier: ai-ingestion
        annotations:
          summary: "CRITICAL: AI Ingestion pipeline failure rate exceeds 5%"
          description: "Document ingestion failure rate is {{ $value | printf \"%.2f\" }}% over a 5-minute window."
          runbook_url: "docs/Deployment/observability-monitoring-runbook.md#aiingestionfailureratehigh"

      - alert: AIOCRProcessingTimeout
        expr: histogram_quantile(0.95, sum(rate(ai_ocr_duration_seconds_bucket[5m])) by (le)) > 60.0
        for: 3m
        labels:
          severity: WARNING
          tier: ai-ocr
        annotations:
          summary: "OCR extraction duration p95 exceeds 60 seconds"
          description: "Optical character recognition p95 latency is {{ $value | printf \"%.1f\" }}s."
          runbook_url: "docs/Deployment/observability-monitoring-runbook.md#aiocrprocessingtimeout"

      - alert: AIEmbeddingLatencyHigh
        expr: histogram_quantile(0.95, sum(rate(ai_embedding_duration_seconds_bucket[5m])) by (le)) > 0.50
        for: 3m
        labels:
          severity: WARNING
          tier: ai-embeddings
        annotations:
          summary: "Vector embedding generation p95 exceeds 500ms"
          description: "Vector embedding latency is {{ $value | printf \"%.3f\" }}s (SLA: 0.500s)."
          runbook_url: "docs/Deployment/observability-monitoring-runbook.md#aiembeddinglatencyhigh"

      # ------------------------------------------------------------------------
      # AI Retrieval-Augmented Generation (RAG) Engine Alerts (Phase 2.2)
      # ------------------------------------------------------------------------
      - alert: RAGQueryLatencyHigh
        expr: histogram_quantile(0.95, sum(rate(rag_query_duration_seconds_bucket[5m])) by (le)) > 2.0
        for: 5m
        labels:
          severity: WARNING
          tier: ai-rag
        annotations:
          summary: "RAG query p95 latency exceeds 2.0s target"
          description: "End-to-end RAG answer synthesis p95 latency is {{ $value | printf \"%.2f\" }}s (SLA: 2.0s)."
          runbook_url: "docs/Deployment/observability-monitoring-runbook.md#ragquerylatencyhigh"

      - alert: RAGRetrievalFailureHigh
        expr: (sum(rate(rag_queries_total{status="ERROR"}[5m])) / sum(rate(rag_queries_total[5m]))) * 100 > 5.0
        for: 5m
        labels:
          severity: CRITICAL
          tier: ai-rag
        annotations:
          summary: "CRITICAL: RAG retrieval & generation failure rate exceeds 5%"
          description: "Hybrid search and LLM synthesis failure rate is {{ $value | printf \"%.2f\" }}% over 5m."
          runbook_url: "docs/Deployment/observability-monitoring-runbook.md#ragretrievalfailurehigh"

      - alert: RAGLowConfidenceRateHigh
        expr: (sum(rate(rag_queries_low_confidence_total[10m])) / sum(rate(rag_queries_total[10m]))) * 100 > 20.0
        for: 10m
        labels:
          severity: WARNING
          tier: ai-rag
        annotations:
          summary: "High volume of low-confidence RAG queries (>20%)"
          description: "Over 20% of RAG queries received confidence scores below 0.70, indicating potential knowledge base gaps."
          runbook_url: "docs/Deployment/observability-monitoring-runbook.md#raglowconfidenceratehigh"

      - alert: RAGTokenUsageHigh
        expr: sum(rate(rag_tokens_consumed_total[5m])) * 60 > 100000
        for: 5m
        labels:
          severity: WARNING
          tier: ai-rag
        annotations:
          summary: "RAG token consumption velocity exceeds 100k tokens/min"
          description: "LLM token burn rate is {{ $value | printf \"%.0f\" }} tokens/min, exceeding baseline budget rate."
      # ------------------------------------------------------------------------
      # AI Assistant & Agentic Workflow Alerts (Phase 2.3)
      # ------------------------------------------------------------------------
      - alert: AssistantWorkflowFailureHigh
        expr: (sum(rate(assistant_workflows_total{status="FAILED"}[5m])) / sum(rate(assistant_workflows_total[5m]))) * 100 > 5.0
        for: 5m
        labels:
          severity: CRITICAL
          tier: ai-assistant
        annotations:
          summary: "CRITICAL: AI Assistant workflow failure rate exceeds 5%"
          description: "Agentic DAG workflow execution failure rate is {{ $value | printf \"%.2f\" }}% over a 5-minute rolling window."
          runbook_url: "docs/Deployment/observability-monitoring-runbook.md#assistantworkflowfailurehigh"

      - alert: AssistantApprovalPendingLag
        expr: assistant_approvals_pending_total > 20
        for: 15m
        labels:
          severity: WARNING
          tier: ai-assistant
        annotations:
          summary: "High volume of pending Human-in-the-Loop approvals (>20)"
          description: "Over 20 workflow approvals are blocked in PENDING state for >15 minutes."
          runbook_url: "docs/Deployment/observability-monitoring-runbook.md#assistantapprovalpendinglag"

      - alert: AssistantTaskExecutionLatencyHigh
        expr: histogram_quantile(0.95, sum(rate(assistant_task_duration_seconds_bucket[5m])) by (le)) > 3.0
        for: 5m
        labels:
          severity: WARNING
          tier: ai-assistant
        annotations:
          summary: "Assistant task execution p95 latency exceeds 3.0s SLA"
          description: "Multi-step agent task execution duration is {{ $value | printf \"%.2f\" }}s (SLA: 3.0s)."
          runbook_url: "docs/Deployment/observability-monitoring-runbook.md#assistanttaskexecutionlatencyhigh"

      - alert: AssistantToolErrorRateHigh
        expr: (sum(rate(assistant_tool_invocations_total{status="ERROR"}[5m])) / sum(rate(assistant_tool_invocations_total[5m]))) * 100 > 5.0
        for: 5m
        labels:
          severity: CRITICAL
          tier: ai-assistant
        annotations:
          summary: "CRITICAL: Assistant tool invocation error rate exceeds 5%"
          description: "Tool execution failure rate across registered plugins is {{ $value | printf \"%.2f\" }}% over 5m."
          runbook_url: "docs/Deployment/observability-monitoring-runbook.md#assistanttoolerrorratehigh"

      # ------------------------------------------------------------------------
      # Knowledge Graph & Enterprise Intelligence Alerts (Phase 2.4)
      # ------------------------------------------------------------------------
      - alert: GraphQueryLatencyHigh
        expr: histogram_quantile(0.95, sum(rate(graph_query_duration_seconds_bucket[5m])) by (le)) > 2.0
        for: 5m
        labels:
          severity: WARNING
          tier: knowledge-graph
        annotations:
          summary: "Knowledge graph query p95 latency exceeds 2.0s SLA"
          description: "Multi-hop graph query traversal duration is {{ $value | printf \"%.2f\" }}s (SLA: 2.0s)."
          runbook_url: "docs/Deployment/observability-monitoring-runbook.md#graphquerylatencyhigh"

      - alert: GraphTraversalDepthExceeded
        expr: sum(rate(graph_traversal_depth_exceeded_total[5m])) * 60 > 5
        for: 2m
        labels:
          severity: WARNING
          tier: knowledge-graph
        annotations:
          summary: "Excessive deep traversal query requests detected (>5/min)"
          description: "Graph queries exceeding maximum depth limit (5 hops) rate is {{ $value | printf \"%.0f\" }}/min."
          runbook_url: "docs/Deployment/observability-monitoring-runbook.md#graphtraversaldepthexceeded"

      - alert: GraphBuildFailureRateHigh
        expr: (sum(rate(graph_build_operations_total{status="FAILED"}[5m])) / sum(rate(graph_build_operations_total[5m]))) * 100 > 5.0
        for: 5m
        labels:
          severity: CRITICAL
          tier: knowledge-graph
        annotations:
          summary: "CRITICAL: Knowledge graph construction failure rate exceeds 5%"
          description: "Graph construction pipeline failure rate is {{ $value | printf \"%.2f\" }}% over a 5-minute rolling window."
          runbook_url: "docs/Deployment/observability-monitoring-runbook.md#graphbuildfailureratehigh"

      - alert: GraphOrphanNodeRatioHigh
        expr: (graph_orphan_entities_total / graph_entities_total) * 100 > 30.0
        for: 15m
        labels:
          severity: WARNING
          tier: knowledge-graph
        annotations:
          summary: "High ratio of disconnected/orphan graph entities (>30%)"
          description: "Over 30% of entities in the knowledge graph have degree 0, indicating potential linking degradation."
          runbook_url: "docs/Deployment/observability-monitoring-runbook.md#graphorphannoderatiohigh"

      # ------------------------------------------------------------------------
      # Enterprise Intelligence & Predictive Analytics Alerts (Phase 2.5)
      # ------------------------------------------------------------------------
      - alert: KnowledgeHealthCritical
        expr: knowledge_health_score_composite < 50.0
        for: 15m
        labels:
          severity: WARNING
          tier: enterprise-intelligence
        annotations:
          summary: "Institutional Knowledge Health Score dropped below AT_RISK threshold (<50)"
          description: "KHS composite score is {{ $value | printf \"%.1f\" }}/100, indicating severe coverage or freshness degradation."
          runbook_url: "docs/Deployment/observability-monitoring-runbook.md#knowledgehealthcritical"

      - alert: StorageRunwayExhaustionRisk
        expr: storage_runway_days_to_warning < 14
        for: 10m
        labels:
          severity: CRITICAL
          tier: storage
        annotations:
          summary: "CRITICAL: Storage capacity runway is under 14 days"
          description: "Projected storage growth estimates reach 85% capacity in {{ $value | printf \"%.0f\" }} days."
          runbook_url: "docs/Deployment/observability-monitoring-runbook.md#storagerunwayexhaustionrisk"

      - alert: HighOperationalAnomalyCount
        expr: detected_anomalies_active_total > 5
        for: 10m
        labels:
          severity: WARNING
          tier: enterprise-intelligence
        annotations:
          summary: "High number of unresolved operational anomalies detected (>5)"
          description: "{{ $value | printf \"%.0f\" }} statistical Z-score anomalies remain active across the organization."
          runbook_url: "docs/Deployment/observability-monitoring-runbook.md#highoperationalanomalycount"

      - alert: AnalyticsComputationLatencyHigh
        expr: histogram_quantile(0.95, sum(rate(analytics_computation_duration_seconds_bucket[5m])) by (le)) > 2.0
        for: 5m
        labels:
          severity: WARNING
          tier: enterprise-intelligence
        annotations:
          summary: "Analytics calculation p95 latency exceeds 2.0s SLA"
          description: "Analytics & KHS computation duration is {{ $value | printf \"%.2f\" }}s (SLA: 2.0s)."
          runbook_url: "docs/Deployment/observability-monitoring-runbook.md#analyticscomputationlatencyhigh"

      # ------------------------------------------------------------------------
      # Enterprise Integrations & Connector Framework Alerts (Phase 3.1)
      # ------------------------------------------------------------------------
      - alert: ConnectorSyncFailureRateHigh
        expr: (sum(rate(connector_sync_jobs_failed_total[5m])) / (sum(rate(connector_sync_jobs_total[5m])) + 0.001)) * 100 > 10.0
        for: 5m
        labels:
          severity: WARNING
          tier: enterprise-connectors
        annotations:
          summary: "Connector sync failure rate exceeds 10% SLA threshold"
          description: "Connector synchronization failure rate is {{ $value | printf \"%.1f\" }}% over the last 5 minutes."
          runbook_url: "docs/Deployment/observability-monitoring-runbook.md#connectorsyncfailureratehigh"

      - alert: ConnectorConsecutiveFailuresHigh
        expr: connector_consecutive_failures_count >= 3
        for: 3m
        labels:
          severity: CRITICAL
          tier: enterprise-connectors
        annotations:
          summary: "CRITICAL: Connector experienced 3 or more consecutive synchronization failures"
          description: "Connector instance {{ $labels.connector_id }} ({{ $labels.platform_type }}) failed {{ $value }} consecutive sync cycles."
          runbook_url: "docs/Deployment/observability-monitoring-runbook.md#connectorconsecutivefailureshigh"

      - alert: ConnectorSyncDurationHigh
        expr: histogram_quantile(0.95, sum(rate(connector_sync_duration_seconds_bucket[10m])) by (le)) > 60.0
        for: 5m
        labels:
          severity: WARNING
          tier: enterprise-connectors
        annotations:
          summary: "Connector synchronization p95 latency exceeds 60s"
          description: "P95 sync batch latency is {{ $value | printf \"%.1f\" }}s for connector {{ $labels.platform_type }}."
          runbook_url: "docs/Deployment/observability-monitoring-runbook.md#connectorsyncdurationhigh"

      - alert: ConnectorAuthExpiringSoon
        expr: connector_auth_token_expires_in_seconds < 86400
        for: 30m
        labels:
          severity: WARNING
          tier: enterprise-connectors
        annotations:
          summary: "Connector authentication credential/token expires in < 24 hours"
          description: "Connector {{ $labels.connector_id }} credentials will expire in {{ $value | printf \"%.0f\" }} seconds. Refresh required."
          runbook_url: "docs/Deployment/observability-monitoring-runbook.md#connectorauthexpiringsoon"

      # ------------------------------------------------------------------------
      # Phase 3.2 Real-Time Collaboration & Team Workspaces Alerts
      # ------------------------------------------------------------------------
      - alert: CollaborationCommentLatencyHigh
        expr: histogram_quantile(0.95, sum(rate(collaboration_comment_duration_seconds_bucket[5m])) by (le)) > 0.50
        for: 2m
        labels:
          severity: WARNING
          tier: collaboration
        annotations:
          summary: "Document comment creation p95 latency exceeds 500ms SLA"
          description: "P95 latency for comment submission is {{ $value | printf \"%.3f\" }}s (threshold: 0.500s)."
          runbook_url: "docs/Deployment/observability-monitoring-runbook.md#collaborationcommentlatencyhigh"

      - alert: CollaborationDiscussionSummaryLatencyHigh
        expr: histogram_quantile(0.95, sum(rate(collaboration_summary_duration_seconds_bucket[5m])) by (le)) > 2.0
        for: 2m
        labels:
          severity: WARNING
          tier: collaboration
        annotations:
          summary: "AI Discussion summary generation p95 latency exceeds 2.0s"
          description: "AI discussion summarization latency is {{ $value | printf \"%.2f\" }}s (threshold: 2.00s)."
          runbook_url: "docs/Deployment/observability-monitoring-runbook.md#collaborationdiscussionsummarylatencyhigh"

      - alert: CollaborationActivityFeedLag
        expr: histogram_quantile(0.95, sum(rate(collaboration_activity_feed_duration_seconds_bucket[5m])) by (le)) > 1.0
        for: 3m
        labels:
          severity: WARNING
          tier: collaboration
        annotations:
          summary: "Activity feed query latency exceeds 1.0s SLA"
          description: "Activity feed response time p95 is {{ $value | printf \"%.2f\" }}s (threshold: 1.00s)."
          runbook_url: "docs/Deployment/observability-monitoring-runbook.md#collaborationactivityfeedlag"

      - alert: CollaborationPresenceHeartbeatFailureRate
        expr: (sum(rate(collaboration_presence_heartbeat_errors_total[5m])) / sum(rate(collaboration_presence_heartbeat_total[5m]))) * 100 > 5.0
        for: 2m
        labels:
          severity: CRITICAL
          tier: collaboration
        annotations:
          summary: "Presence heartbeat failure rate exceeds 5%"
          description: "Presence heartbeat error rate is {{ $value | printf \"%.2f\" }}% over the last 5 minutes."
          runbook_url: "docs/Deployment/observability-monitoring-runbook.md#collaborationpresenceheartbeatfailurerate"

      # ------------------------------------------------------------------------
      # Phase 3.3 Enterprise Security, Compliance & Governance Alerts
      # ------------------------------------------------------------------------
      - alert: SecurityFailedLoginSpike
        expr: sum(rate(security_failed_logins_total[3m])) * 60 > 5.0
        for: 1m
        labels:
          severity: HIGH
          tier: security
        annotations:
          summary: "Potential brute force attack: Failed logins exceed 5 in 3 minutes"
          description: "Rate of failed authentication attempts is {{ $value | printf \"%.1f\" }} attempts/min."
          runbook_url: "docs/Deployment/observability-monitoring-runbook.md#securityfailedloginspike"

      - alert: SecurityPromptInjectionDetected
        expr: sum(increase(security_guardrail_blocks_total{reason="prompt_injection"}[5m])) > 0
        for: 0s
        labels:
          severity: CRITICAL
          tier: security
        annotations:
          summary: "Adversarial AI Prompt Injection payload blocked"
          description: "{{ $value }} prompt injection attempt(s) detected and blocked by safety guardrails."
          runbook_url: "docs/Deployment/observability-monitoring-runbook.md#securitypromptinjectiondetected"

      - alert: ComplianceScoreLow
        expr: compliance_overall_score < 85.0
        for: 15m
        labels:
          severity: WARNING
          tier: compliance
        annotations:
          summary: "Enterprise compliance score dropped below 85%"
          description: "Compliance posture has degraded to {{ $value | printf \"%.1f\" }}% (threshold: 85.0%)."
          runbook_url: "docs/Deployment/observability-monitoring-runbook.md#compliancescorelow"

      - alert: SecurityAuditLogLagHigh
        expr: histogram_quantile(0.95, sum(rate(security_audit_log_write_duration_seconds_bucket[5m])) by (le)) > 0.10
        for: 2m
        labels:
          severity: WARNING
          tier: security
        annotations:
          summary: "Audit log write p95 latency exceeds 100ms SLA"
          description: "P95 latency for immutable audit log writes is {{ $value | printf \"%.3f\" }}s."
          runbook_url: "docs/Deployment/observability-monitoring-runbook.md#securityauditloglaghigh"

      - alert: SecurityPIIScanLatencyHigh
        expr: histogram_quantile(0.95, sum(rate(security_pii_scan_duration_seconds_bucket[5m])) by (le)) > 0.10
        for: 2m
        labels:
          severity: WARNING
          tier: security
        annotations:
          summary: "PII classification scan p95 latency exceeds 100ms SLA"
          description: "Deterministic PII regex scan latency is {{ $value | printf \"%.3f\" }}s (threshold: 0.100s)."
          runbook_url: "docs/Deployment/observability-monitoring-runbook.md#securitypiiscanlatencyhigh"

      # ------------------------------------------------------------------------
      # Phase 3.4: Workflow Automation, Approvals & Notifications Alerts
      # ------------------------------------------------------------------------
      - alert: WorkflowExecutionFailureRateHigh
        expr: (sum(rate(workflow_executions_total{status="failed"}[5m])) / sum(rate(workflow_executions_total[5m]))) * 100 > 5.0
        for: 2m
        labels:
          severity: WARNING
          tier: workflow
        annotations:
          summary: "Workflow DAG execution failure rate exceeds 5%"
          description: "Current workflow failure rate is {{ $value | printf \"%.2f\" }}% over a 5-minute rolling window."
          runbook_url: "docs/Deployment/observability-monitoring-runbook.md#workflowexecutionfailureratehigh"

      - alert: WorkflowExecutionDurationHigh
        expr: histogram_quantile(0.95, sum(rate(workflow_execution_duration_seconds_bucket[5m])) by (le)) > 2.0
        for: 3m
        labels:
          severity: WARNING
          tier: workflow
        annotations:
          summary: "Workflow execution p95 duration exceeds 2.0s SLA"
          description: "P95 workflow execution latency is {{ $value | printf \"%.2f\" }}s (SLA threshold: 2.0s)."
          runbook_url: "docs/Deployment/observability-monitoring-runbook.md#workflowexecutiondurationhigh"

      - alert: WorkflowPendingApprovalsStalled
        expr: workflow_pending_approvals_count > 10
        for: 15m
        labels:
          severity: WARNING
          tier: workflow
        annotations:
          summary: "Human-in-the-loop workflow approvals queue stalled"
          description: "There are currently {{ $value }} pending approvals waiting for reviewer sign-off."
          runbook_url: "docs/Deployment/observability-monitoring-runbook.md#workflowpendingapprovalsstalled"

      - alert: NotificationDeliveryFailureRateHigh
        expr: (sum(rate(notification_dispatches_total{status="failed"}[5m])) / sum(rate(notification_dispatches_total[5m]))) * 100 > 2.0
        for: 2m
        labels:
          severity: WARNING
          tier: notification
        annotations:
          summary: "Multi-channel notification delivery failure rate exceeds 2%"
          description: "Failure rate across Email, Slack, Teams, or In-App dispatch is {{ $value | printf \"%.2f\" }}%."
          runbook_url: "docs/Deployment/observability-monitoring-runbook.md#notificationdeliveryfailureratehigh"

      # ------------------------------------------------------------------------
      # Phase 3.5: Plugin SDK, Extension Framework & Sandbox Alerts
      # ------------------------------------------------------------------------
      - alert: PluginExecutionFailureRateHigh
        expr: (sum(rate(plugin_executions_total{status="FAILED"}[5m])) / sum(rate(plugin_executions_total[5m]))) * 100 > 5.0
        for: 2m
        labels:
          severity: WARNING
          tier: plugin
        annotations:
          summary: "Plugin sandboxed execution failure rate exceeds 5%"
          description: "Current plugin failure rate is {{ $value | printf \"%.2f\" }}% over a 5-minute rolling window."
          runbook_url: "docs/Deployment/observability-monitoring-runbook.md#pluginexecutionfailureratehigh"

      - alert: PluginSandboxTimeoutSpike
        expr: sum(increase(plugin_executions_total{status="TIMEOUT"}[5m])) > 3
        for: 1m
        labels:
          severity: CRITICAL
          tier: sandbox
        annotations:
          summary: "Spike in plugin sandbox timeout violations"
          description: "More than 3 plugin tasks were terminated for exceeding execution SLA threshold."
          runbook_url: "docs/Deployment/observability-monitoring-runbook.md#pluginsandboxtimeoutspike"

      - alert: PluginExecutionDurationHigh
        expr: histogram_quantile(0.95, sum(rate(plugin_execution_duration_ms_bucket[5m])) by (le)) > 1500
        for: 3m
        labels:
          severity: WARNING
          tier: plugin
        annotations:
          summary: "Plugin execution p95 duration exceeds 1500ms SLA"
          description: "P95 sandbox execution latency is {{ $value | printf \"%.1f\" }}ms (SLA threshold: 1500ms)."
          runbook_url: "docs/Deployment/observability-monitoring-runbook.md#pluginexecutiondurationhigh"

      - alert: PluginMarketplaceInstallFailureRate
        expr: (sum(rate(plugin_installations_total{status="error"}[5m])) / sum(rate(plugin_installations_total[5m]))) * 100 > 2.0
        for: 2m
        labels:
          severity: WARNING
          tier: marketplace
        annotations:
          summary: "Plugin marketplace package installation error rate exceeds 2%"
          description: "Package download or checksum verification failure rate is {{ $value | printf \"%.2f\" }}%."
          runbook_url: "docs/Deployment/observability-monitoring-runbook.md#pluginmarketplaceinstallfailurerate"



