# ==============================================================================
# KEEP Enterprise Platform — Production Gateway Nginx Configuration
# ==============================================================================
# Specification: devdocs/p1/p1.10.txt (Chapters 3, 4, 8, 11) & docs/api/api-contract.md Section 7
# Architecture: docs/Architecture/deployment-ai-infrastructure.md & ADR-029
# Role: Member 4 (DevOps & Integration Lead)
# ==============================================================================

# Upstream Service Definitions
upstream backend_api {
    server backend:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream frontend_app {
    server frontend:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# ------------------------------------------------------------------------------
# HTTP Server (Port 80) — TLS Redirection & ACME Verification
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name ${PRODUCTION_DOMAIN:-localhost};

    # ACME Challenge for Automated Let's Encrypt SSL/TLS Certificate Issuance
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Lightweight unencrypted health check for external load-balancer probes
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # Redirect all other HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# HTTPS Server (Port 443) — Enterprise Gateway & Reverse Proxy
# ------------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ${PRODUCTION_DOMAIN:-localhost};

    # SSL / TLS Modern Cryptographic Configuration
    ssl_certificate ${SSL_CERT_PATH:-/etc/nginx/certs/fullchain.pem};
    ssl_certificate_key ${SSL_KEY_PATH:-/etc/nginx/certs/privkey.pem};
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Performance: Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Enterprise Defense-in-Depth Security Headers (ADR-029 & API Contract Section 7.3)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https: wss:; frame-ancestors 'none';" always;

    # Client Request Buffers & Upload Limits
    client_max_body_size 100M;
    client_body_buffer_size 128k;

    # 1. Health Check Endpoint (Public / Load-Balancer SLA Probe)
    location = /health {
        proxy_pass http://backend_api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }

    # 2. Detailed Health Diagnostic Probes
    location /health/ {
        proxy_pass http://backend_api/health/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # 3. Backend REST API v1 Routing (with Server-Sent Events / Streaming Support)
    location /api/v1/ {
        proxy_pass http://backend_api/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Request-ID $request_id;

        # SSE & Long-lived streaming settings
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # 4. Prometheus Metrics Scrape Gating (Internal / Private Network Only)
    location = /metrics {
        # Allow internal private subnets, deny public ingress
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny all;

        proxy_pass http://backend_api/metrics;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 5. Immutable Static Asset Caching (Vite / Next.js Chunks)
    location ~* ^/(assets|_next/static)/ {
        proxy_pass http://frontend_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # 6. Frontend SPA Root & View Routing (HTML5 History API)
    location / {
        proxy_pass http://frontend_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_intercept_errors on;
    }

    # Standard Error Pages
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}

# WebSocket / SSE Connection Upgrade Map
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
