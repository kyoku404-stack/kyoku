# ==============================================================================
# KEEP — Grafana Datasource Auto-Provisioning (Phase 1.9)
# Specification: devdocs/p1/p1.9.txt (Chapter 15)
# ==============================================================================

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 5s
      httpMethod: POST

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: false
    jsonData:
      maxLines: 1000
      derivedFields:
        - datasourceUid: Prometheus
          matcherRegex: "trace_id\":\"([a-f0-9]+)"
          name: TraceID
          url: '$${__value.raw}'
