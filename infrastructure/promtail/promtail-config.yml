# ==============================================================================
# KEEP — Promtail Log Ingestion Configuration (Phase 1.9)
# Specification: devdocs/p1/p1.9.txt (Chapter 6, 15)
# Architecture: docs/Architecture/observability-architecture.md (Section 3)
# ==============================================================================

server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: info

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    batchwait: 1s
    batchsize: 1048576

scrape_configs:
  # ----------------------------------------------------------------------------
  # Docker Container Log Scraper (Extracting structured JSON logs)
  # ----------------------------------------------------------------------------
  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_name']
        regex: '.*keep-backend.*'
        target_label: 'service'
        replacement: 'keep-backend'
      - source_labels: ['__meta_docker_container_name']
        regex: '.*keep-frontend.*'
        target_label: 'service'
        replacement: 'keep-frontend'
      - source_labels: ['__meta_docker_container_name']
        regex: '.*keep-postgres.*'
        target_label: 'service'
        replacement: 'keep-postgres'
    pipeline_stages:
      # Parse Canonical KEEP JSON log format (devdocs Chapter 6)
      - json:
          expressions:
            timestamp: timestamp
            level: level
            module: module
            action: action
            status: status
            request_id: request_id
            trace_id: trace_id
            user_id: user_id
            organization_id: organization_id
            execution_time_ms: execution_time_ms
            message: message
      - labels:
          level:
          module:
          action:
          status:
      - timestamp:
          source: timestamp
          format: RFC3339Nano

  # ----------------------------------------------------------------------------
  # Local Log Directory Scraper (for testing & development environments)
  # ----------------------------------------------------------------------------
  - job_name: keep-application-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: keep-logs
          service: keep-backend
          __path__: /var/log/keep/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            module: module
            action: action
            status: status
            request_id: request_id
            trace_id: trace_id
      - labels:
          level:
          module:
          action:
          status:
