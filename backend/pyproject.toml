[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "keep-backend"
version = "0.1.0"
description = "KEEP — Knowledge Extraction & Enterprise Platform Backend Engine"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [
    { name = "KEEP Engineering Team" }
]
classifiers = [
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.110.0,<0.112.0",
    "uvicorn[standard]>=0.28.0,<0.31.0",
    "pydantic>=2.6.0,<3.0.0",
    "pydantic-settings>=2.2.0,<3.0.0",
    "sqlalchemy>=2.0.28,<2.1.0",
    "asyncpg>=0.29.0,<0.30.0",
    "psycopg2-binary>=2.9.9,<3.0.0",
    "alembic>=1.13.0,<1.14.0",
    "pgvector>=0.2.5,<0.3.0",
    "pyjwt>=2.8.0,<3.0.0",
    "passlib[bcrypt]>=1.7.4,<2.0.0",
    "python-multipart>=0.0.9,<0.1.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "httpx>=0.27.0,<0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.23.0,<0.24.0",
    "black>=24.2.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["../tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
ignore = [
    "B008",   # function-call-in-default-argument — required by FastAPI Depends() DI pattern
    "UP046",  # non-pep695-generic-class — Generic[T] required for Pydantic BaseModel subclasses
]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
